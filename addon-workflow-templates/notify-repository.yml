name: Notify Repository

on:
  workflow_call:
    inputs:
      addon_id:
        description: Exact add-on ID produced by the package job.
        required: true
        type: string
      addon_version:
        description: Exact add-on version produced by the package job.
        required: true
        type: string
      asset_name:
        description: Exact deterministic package filename.
        required: true
        type: string
      artifact_sha256:
        description: Lowercase SHA-256 of the package bytes.
        required: true
        type: string
      publication_id:
        description: Exact publication identity in addon_id@addon_version form.
        required: true
        type: string
    secrets:
      REPO_DISPATCH_TOKEN:
        description: Token limited to dispatching repository.serph91p.
        required: true

jobs:
  notify-repository:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: Serph91P/repository.serph91p/.github/workflows/reusable-notify-repository.yml@51c044b2172e6a1c275b0816dd017430140e9f5f
    with:
      source_repository: ${{ github.repository }}
      candidate_sha: ${{ github.sha }}
      validation_run_id: ${{ github.run_id }}
      validation_workflow: Add-on Validations
      validation_workflow_path: .github/workflows/addon-validations.yml@develop
      validation_event: ${{ github.event_name }}
      expected_branch: develop
      addon_id: ${{ inputs.addon_id }}
      addon_version: ${{ inputs.addon_version }}
      asset_name: ${{ inputs.asset_name }}
      artifact_sha256: ${{ inputs.artifact_sha256 }}
      publication_id: ${{ inputs.publication_id }}
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
