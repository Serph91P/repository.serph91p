name: Update Repository

on:
  # Triggered by addon repos via repository_dispatch
  repository_dispatch:
    types: [addon-updated]

  # Manual trigger
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all addons'
        required: false
        default: 'false'
        type: boolean

  # Also rebuild on push to main (e.g. when addon.xml of repo itself changes)
  push:
    branches: [main]
    paths:
      - 'addon.xml'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_repository.py

      - name: Create GitHub Pages structure
        run: |
          # Create the pages output directory
          mkdir -p _site

          # Copy all addon directories with their ZIPs flat into _site
          for addon_dir in repo/*/; do
            addon_name=$(basename "$addon_dir")
            mkdir -p "_site/${addon_name}"
            cp -r "${addon_dir}"* "_site/${addon_name}/" 2>/dev/null || true

            # Create Kodi-parseable directory listing for each addon
            cd "_site/${addon_name}"
            echo '<html><body>' > index.html
            for f in *.zip *.xml *.png *.jpg; do
              [ -f "$f" ] && echo "<a href=\"$f\">$f</a><br/>" >> index.html
            done
            echo '</body></html>' >> index.html
            cd "$GITHUB_WORKSPACE"
          done

          # Copy addons.xml and md5 to root
          cp repo/addons.xml _site/
          cp repo/addons.xml.md5 _site/

          # Copy repo ZIP to root for convenience
          cp repo/repository.serph91p/*.zip _site/ 2>/dev/null || true

          # Create Kodi-parseable root directory listing
          cd _site
          cat > index.html << 'HTMLEOF'
          <html><body>
          HTMLEOF

          # List all addon directories
          for d in */; do
            dirname=$(basename "$d")
            echo "<a href=\"${dirname}/\">${dirname}</a><br/>" >> index.html
          done

          # List root files
          for f in *.zip *.xml *.md5; do
            [ -f "$f" ] && echo "<a href=\"$f\">$f</a><br/>" >> index.html
          done

          echo '</body></html>' >> index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
