name: Update Repository

on:
  repository_dispatch:
    types: [validated-addon-publication]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_ARTIFACT_TOKEN }}
          DISPATCH_PAYLOAD: ${{ github.event.client_payload && toJSON(github.event.client_payload) || '' }}
        run: python scripts/build_repository.py

      - name: Validate generated Pages manifest
        run: python scripts/build_repository.py --validate-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
