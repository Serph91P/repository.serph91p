name: Publish target-owned Setup source

# Deliberate manual publication gate, not an upstream validation run and not a
# repository_dispatch producer. The external-artifact workflow stays separate.
on:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repository:
    if: github.repository == 'Serph91P/repository.serph91p' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download current repository manifest
        run: python scripts/build_repository.py --download-current-manifest
      - name: Build target-owned Wizard and original repository bootstrap
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: python scripts/build_repository.py --first-party --target-commit "$TARGET_COMMIT"
      - name: Validate generated Pages manifest
        run: python scripts/build_repository.py --validate-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build-repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
